<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlanejaEdu — Plataforma</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--p:#5b45f5;--p2:#7357f7;--bg:#f5f6fc;--card:#fff;--text:#101a38;--muted:#74809b;--line:#e1e5ef;--ok:#16a36b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 10%,#ece8ff,transparent 35%),radial-gradient(circle at 90% 90%,#e9e6ff,transparent 35%),var(--bg)}
.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 25px 70px #1d265012}.brand{font-weight:900;font-size:25px;letter-spacing:-1px}.brand span{color:var(--p)}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:900;color:var(--p)}h1{font-size:34px;margin:8px 0}h2{margin:0;font-size:19px}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);padding:12px;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #5b45f518}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:800}.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.secondary{background:#f5f4fb;border:1px solid var(--line);color:var(--text)}.login .btn{width:100%;margin-top:18px}.demo{margin-top:12px;font-size:11px;text-align:center}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh}.side-brand{padding:4px 12px 25px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:12px;border-radius:12px;text-align:left;color:#53607c;font-weight:750}.nav button.active{background:#eeeaff;color:#4d35e7}.logout{position:absolute;left:16px;right:16px;bottom:20px}.main{padding:34px 5vw}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.user-pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;display:flex;align-items:center;gap:8px}.content{margin-top:25px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px}.stat small{font-size:10px;letter-spacing:1.4px;color:var(--muted);font-weight:800}.stat strong{display:block;font-size:30px;margin-top:8px}.panel{margin-top:16px}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:15px}.toolbar input{max-width:360px}.table{border:1px solid var(--line);border-radius:14px;overflow:auto}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:12px;padding:15px;border-bottom:1px solid var(--line);align-items:center}.row.head{background:#fafbff;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:900}.row:last-child{border-bottom:0}.tag{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#eaf9f2;color:#087c50;font-size:10px;font-weight:800}.modal{position:fixed;inset:0;background:#151a2d66;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{background:#fff;border-radius:20px;width:min(620px,100%);padding:25px;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:transparent;font-size:25px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.check{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px}.check input{width:auto}.preview{border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;min-height:120px;background:linear-gradient(135deg,#fff,#fafaff)}.headers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.header-card{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.header-card.selected{border-color:var(--p);box-shadow:0 8px 20px #5b45f51c}.pix{border:1px solid #ded8ff;background:#faf9ff;border-radius:15px;padding:18px;margin-top:16px}.pix strong{color:var(--p)}.students{display:grid;gap:8px}.student-line{display:grid;grid-template-columns:1fr 150px auto;gap:8px}.notice{padding:12px;border-radius:12px;background:#f4f5fb;color:#5d6781;font-size:12px;margin-top:10px}.dark{--bg:#0f1320;--card:#171c2b;--text:#f5f7ff;--muted:#a9b1c7;--line:#2a3248}.dark .sidebar,.dark .panel,.dark .stat,.dark .modal-card,.dark .login-card,.dark .header-card,.dark input,.dark select,.dark textarea,.dark .user-pill{background:#171c2b}.dark .nav button{color:#c4cbe0}.dark .nav button.active{background:#29224d}.dark .row.head{background:#1c2233}.dark .secondary{background:#20273a;color:#fff}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(3,1fr)}.logout{position:static;margin-top:12px}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.checks,.headers{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.main{padding:22px 14px}.top{align-items:flex-start}.nav{grid-template-columns:1fr 1fr}.stats,.form-grid,.checks,.headers{grid-template-columns:1fr}.student-line{grid-template-columns:1fr}.full{grid-column:auto}.login-card{padding:24px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="brand">Planeja<span>Edu</span></div>
    <div class="eyebrow" style="margin-top:35px">PLANEJAMENTO ESCOLAR</div>
    <h1>Bem-vinda!</h1>
    <p class="muted">Entre para acessar seu espaço pedagógico.</p>
    <div class="field"><label>E-mail</label><input id="loginEmail" type="email" placeholder="seu@email.com"></div>
    <div class="field"><label>Senha</label><input id="loginPass" type="password" placeholder="••••••••"></div>
    <button class="btn primary" onclick="login()">Entrar na plataforma <i data-lucide="arrow-right"></i></button>
    <button class="btn secondary" onclick="demoLogin()">Entrar em modo demonstração</button>
    <div class="demo muted">A conta de demonstração não envia dados para nenhum servidor.</div>
  </div>
</div>

<div id="app" class="shell hidden">
<aside class="sidebar">
  <div class="side-brand"><div class="brand">Planeja<span>Edu</span></div><small class="muted">Gestão pedagógica inteligente</small></div>
  <nav class="nav">
    <button data-page="dashboard" onclick="showPage('dashboard')"><i data-lucide="layout-dashboard"></i>Visão geral</button>
    <button data-page="professores" onclick="showPage('professores')"><i data-lucide="users"></i>Professores</button>
    <button data-page="formularios" onclick="showPage('formularios')"><i data-lucide="inbox"></i>Formulários recebidos</button>
    <button data-page="escolas" onclick="showPage('escolas')"><i data-lucide="school"></i>Escolas</button>
    <button data-page="turmas" onclick="showPage('turmas')"><i data-lucide="graduation-cap"></i>Turmas</button>
    <button data-page="disciplinas" onclick="showPage('disciplinas')"><i data-lucide="book-open"></i>Disciplinas</button>
    <button data-page="cabecalhos" onclick="showPage('cabecalhos')"><i data-lucide="file-text"></i>Cabeçalhos</button>
    <button data-page="planos" onclick="showPage('planos')"><i data-lucide="notebook-pen"></i>Planos de aula</button>
    <button data-page="config" onclick="showPage('config')"><i data-lucide="settings"></i>Configurações</button>
  </nav>
  <button class="btn secondary logout" onclick="logout()"><i data-lucide="log-out"></i> Sair</button>
</aside>
<main class="main">
  <div class="top"><div><div class="eyebrow">ADMINISTRAÇÃO</div><h1 id="pageTitle">Visão geral</h1><p class="muted" id="pageSub">Acompanhe a estrutura da plataforma.</p></div><div class="user-pill"><i data-lucide="user-round"></i><span id="userName">Julia Cardoso</span></div></div>
  <div id="content" class="content"></div>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Novo cadastro</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>

<script>
const KEY='planejaEduFinalState';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 user:{name:'Julia Cardoso',email:'julia@planejaedu.com'},
 professors:[],forms:[],schools:[],classes:[],subjects:['Língua Portuguesa','Matemática','Ciências','História','Geografia','Ensino Religioso','Arte','Educação Física','Projetos Interdisciplinares'],
 headers:[
  {name:'Escola Municipal Professora Irmã Blandina Cisz',desc:'Município de Lajeado Grande',image:''},
  {name:'Irmã Blandina',desc:'Secretaria / identificação institucional',image:''},
  {name:'Escola Estadual',desc:'Modelo para rede estadual',image:''},
  {name:'Escola Particular',desc:'Modelo para rede particular',image:''},
  {name:'Integral (Lajeado Grande)',desc:'Cabeçalho do projeto integral',image:''}
 ],
 settings:{dark:false,accent:'#5b45f5',photo:''}
};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function icon(){lucide.createIcons()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function login(){state.user.name=(document.getElementById('loginEmail').value.split('@')[0]||'Julia Cardoso').replace(/[._-]/g,' ');save();enter()}
function demoLogin(){state.user={name:'Julia Cardoso',email:'julia@planejaedu.com'};save();enter()}
function enter(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userName').textContent=state.user.name;applyTheme();showPage('dashboard')}
function logout(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function applyTheme(){document.body.classList.toggle('dark',!!state.settings.dark);document.documentElement.style.setProperty('--p',state.settings.accent||'#5b45f5')}
const titles={dashboard:['Visão geral','Acompanhe a estrutura da plataforma.'],professores:['Professores','Professores ativos e seus vínculos com as escolas.'],formularios:['Formulários recebidos','Cadastros enviados pelas professoras.'],escolas:['Escolas','Gerencie escolas, cidades, estados e quantidade de professoras ativas.'],turmas:['Turmas','Organize turmas, turnos e alunos para a chamada automática.'],disciplinas:['Disciplinas','Mantenha as disciplinas disponíveis para os planos.'],cabecalhos:['Cabeçalhos institucionais','Gerencie os modelos usados nos planos e PDFs.'],planos:['Planos de aula','Consulte e organize os planejamentos.'],config:['Configurações','Perfil, foto e aparência da plataforma.']};
function showPage(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent=titles[p][0];document.getElementById('pageSub').textContent=titles[p][1];document.getElementById('content').innerHTML=pageFactories[p]();icon()}
const pageFactories = {
dashboard:()=>`<div class="grid stats">
${[['Professores ativos',state.professors.length],['Escolas',state.schools.length],['Turmas',state.classes.length],['Planos de aula',0]].map(x=>`<div class="stat"><small>${x[0].toUpperCase()}</small><strong>${x[1]}</strong></div>`).join('')}</div>
<div class="panel"><div class="toolbar"><div><h2>Resumo da plataforma</h2><p class="muted">Sem professores fictícios: os números começam a partir dos cadastros reais.</p></div><button class="btn primary" onclick="openProfessor()">+ Novo cadastro</button></div>
<div class="notice"><b>Fluxo atualizado:</b> professora se registra e entra automaticamente como ativa. Não existe etapa de aprovação manual.</div></div>`,
professores:()=>tablePage('Professores', ['Nome','Cidade/UF','Escolas','Status'], state.professors.map((p,i)=>[p.name,p.city+' / '+p.state,(p.schools||[]).length,'<span class="tag">Ativa</span>']), 'openProfessor()'),
formularios:()=>tablePage('Formulários recebidos',['Professora','Cidade/UF','Função','Status'],state.forms.map(f=>[f.name,f.city+' / '+f.state,f.funcao,'<span class="tag">Recebido</span>']),''),
escolas:()=>tablePage('Escolas',['Escola','Cidade/UF','Professores ativos','Rede'],state.schools.map(s=>[s.name,s.city+' / '+s.state,String(state.professors.filter(p=>(p.schools||[]).includes(s.name)).length),s.network]),'openSchool()'),
turmas:()=>tablePage('Turmas',['Turma','Segmento','Escola','Turno'],state.classes.map(c=>[c.name,c.segment,c.school,c.shift]),'openClass()'),
disciplinas:()=>tablePage('Disciplinas',['Disciplina','Descrição','Status'],state.subjects.map(s=>[s,'Disponível','<span class="tag">Ativa</span>']),'openSubject()'),
cabecalhos:()=>`<div class="toolbar"><input placeholder="Buscar cabeçalho..." oninput="filterHeaders(this.value)"><button class="btn primary" onclick="openHeader()">+ Novo cadastro</button></div><div id="headerList" class="headers">${state.headers.map((h,i)=>headerCard(h,i)).join('')}</div>`,
planos:()=>`<div class="panel"><h2>Planos de aula</h2><p class="muted">Área preparada para vincular planos às professoras, escolas, turmas, disciplinas e cabeçalhos.</p><div class="notice">A chamada automática poderá usar as listas de alunos cadastradas em cada turma.</div></div>`,
config:()=>`<div class="panel"><h2>Perfil da professora</h2><div class="form-grid">
<div><div class="field"><label>Nome</label><input value="${esc(state.user.name)}" onchange="state.user.name=this.value;save();document.getElementById('userName').textContent=this.value"></div>
<div class="field"><label>E-mail</label><input value="${esc(state.user.email)}" onchange="state.user.email=this.value;save()"></div></div>
<div><div class="field"><label>Foto de perfil</label><input type="file" accept="image/*" onchange="setPhoto(this)"><div style="margin-top:10px">${state.settings.photo?`<img src="${state.settings.photo}" style="width:80px;height:80px;border-radius:50%;object-fit:cover">`:'<span class="muted">Nenhuma foto adicionada.</span>'}</div></div></div>
</div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h2>Aparência</h2><div class="field"><label><input type="checkbox" style="width:auto" ${state.settings.dark?'checked':''} onchange="state.settings.dark=this.checked;save();applyTheme()"> Modo escuro</label></div><div class="field"><label>Cor principal</label><input type="color" value="${state.settings.accent}" onchange="state.settings.accent=this.value;save();applyTheme()"></div></div>`
};
const tablePage=(name,cols,rows,action)=>`<div class="toolbar"><input placeholder="Buscar...">${action?`<button class="btn primary" onclick="${action}">+ Novo cadastro</button>`:''}</div><div class="table"><div class="row head">${cols.map(c=>`<span>${c}</span>`).join('')}<span></span></div>${rows.length?rows.map(r=>`<div class="row">${r.map(c=>`<span>${c}</span>`).join('')}<button class="btn secondary" style="padding:7px 10px">•••</button></div>`).join(''):`<div class="row"><span class="muted">Nenhum cadastro ainda.</span></div>`}</div>`;
function headerCard(h,i){return `<div class="header-card"><b>${esc(h.name)}</b><p class="muted" style="font-size:12px">${esc(h.desc)}</p><div class="preview"><strong>${esc(h.name)}</strong><br><small class="muted">${esc(h.desc)}</small></div></div>`}
function filterHeaders(q){const x=q.toLowerCase();document.getElementById('headerList').innerHTML=state.headers.filter(h=>h.name.toLowerCase().includes(x)||h.desc.toLowerCase().includes(x)).map(headerCard).join('')}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.remove('hidden');icon()}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function openProfessor(){openModal('Novo cadastro de professora',`<div class="form-grid">
<div><div class="field"><label>Nome completo *</label><input id="pName"></div><div class="field"><label>WhatsApp *</label><input id="pPhone" placeholder="(49) 99999-9999"></div></div>
<div><div class="field"><label>Cidade *</label><input id="pCity" value="Lajeado Grande"></div><div class="field"><label>Estado *</label><select id="pState"><option>SC</option><option>PR</option><option>RS</option></select></div></div>
<div><div class="field"><label>Função</label><select id="pFunc"><option>Professora</option><option>Coordenadora</option><option>Diretora</option><option>Supervisora</option><option>Outra</option></select></div></div>
<div class="full"><div class="field"><label>Escolas</label><div class="checks">${state.schools.map((s,i)=>`<label class="check"><input type="checkbox" name="pschool" value="${esc(s.name)}"> ${esc(s.name)}</label>`).join('')||'<span class="muted">Cadastre uma escola primeiro.</span>'}</div></div></div>
<div class="full"><div class="pix"><b>Lista de alunos para chamada automática</b><p class="muted">Opcional. A professora pode cadastrar os nomes aqui ou enviar print/lista pelo WhatsApp.</p><button type="button" class="btn secondary" onclick="window.open('https://wa.me/5549999674823?text='+encodeURIComponent('Olá! Quero enviar a lista de alunos e turmas para a chamada automática do PlanejaEdu.'),'_blank')">Enviar lista pelo WhatsApp</button></div></div>
</div><button class="btn primary" style="width:100%;margin-top:18px" onclick="saveProfessor()">Cadastrar professora</button>`)}
function saveProfessor(){const p={name:document.getElementById('pName').value.trim(),phone:document.getElementById('pPhone').value.trim(),city:document.getElementById('pCity').value.trim(),state:document.getElementById('pState').value,funcao:document.getElementById('pFunc').value,schools:[...document.querySelectorAll('input[name="pschool"]:checked')].map(x=>x.value)};if(!p.name||!p.phone){alert('Preencha nome e WhatsApp.');return}state.professors.push(p);state.forms.push({...p});save();closeModal();showPage('professores')}
function openSchool(){openModal('Adicionar escola',`<div class="field"><label>Nome da escola *</label><input id="sName" placeholder="Nome completo"></div><div class="form-grid"><div class="field"><label>Rede</label><select id="sNet"><option>Municipal</option><option>Estadual</option><option>Particular</option><option>Federal</option></select></div><div class="field"><label>Cidade</label><input id="sCity" value="Lajeado Grande"></div><div class="field"><label>Estado</label><select id="sState"><option>SC</option><option>PR</option><option>RS</option></select></div></div><button class="btn primary" style="width:100%;margin-top:18px" onclick="saveSchool()">Salvar</button>`)}
function saveSchool(){const s={name:document.getElementById('sName').value.trim(),network:document.getElementById('sNet').value,city:document.getElementById('sCity').value.trim(),state:document.getElementById('sState').value};if(!s.name)return alert('Informe o nome da escola.');state.schools.push(s);save();closeModal();showPage('escolas')}
function openClass(){openModal('Nova turma',`<div class="form-grid"><div class="field"><label>Nome da turma *</label><input id="cName" placeholder="Ex.: 3º ano A"></div><div class="field"><label>Segmento</label><select id="cSeg"><option>Maternal</option><option>Educação Infantil</option><option>Ensino Fundamental</option><option>Ensino Médio</option></select></div><div class="field"><label>Escola</label><select id="cSchool">${state.schools.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Turno</label><select id="cShift"><option>Matutino</option><option>Vespertino</option><option>Integral</option><option>Noturno</option></select></div><div class="full"><label>Alunos da turma (opcional)</label><div id="students" class="students"><div class="student-line"><input placeholder="Nome da criança"><select><option>Presente</option><option>Ativo</option></select><button class="btn secondary" onclick="this.parentElement.remove()">×</button></div></div><button class="btn secondary" style="margin-top:8px" onclick="addStudent()">+ Adicionar aluno</button></div></div><div class="notice">A lista de alunos será usada futuramente para montar a chamada automática.</div><button class="btn primary" style="width:100%;margin-top:18px" onclick="saveClass()">Salvar turma</button>`)}
function addStudent(){document.getElementById('students').insertAdjacentHTML('beforeend',`<div class="student-line"><input placeholder="Nome da criança"><select><option>Presente</option><option>Ativo</option></select><button class="btn secondary" onclick="this.parentElement.remove()">×</button></div>`)}
function saveClass(){const c={name:document.getElementById('cName').value.trim(),segment:document.getElementById('cSeg').value,school:document.getElementById('cSchool').value,shift:document.getElementById('cShift').value,students:[...document.querySelectorAll('#students input')].map(x=>x.value).filter(Boolean)};if(!c.name)return alert('Informe o nome da turma.');state.classes.push(c);save();closeModal();showPage('turmas')}
function openSubject(){openModal('Adicionar disciplina',`<div class="field"><label>Disciplina *</label><input id="subName"></div><div class="field"><label>Descrição</label><input id="subDesc"></div><button class="btn primary" style="width:100%;margin-top:18px" onclick="saveSubject()">Salvar</button>`)}
function saveSubject(){const x=document.getElementById('subName').value.trim();if(!x)return alert('Informe a disciplina.');if(!state.subjects.includes(x))state.subjects.push(x);save();closeModal();showPage('disciplinas')}
function openHeader(){openModal('Adicionar cabeçalho',`<div class="field"><label>Nome do cabeçalho *</label><input id="hName" placeholder="Ex.: Integral (Lajeado Grande)"></div><div class="field"><label>Descrição</label><input id="hDesc"></div><div class="field"><label>Imagem do cabeçalho</label><input type="file" accept="image/*"></div><button class="btn primary" style="width:100%;margin-top:18px" onclick="saveHeader()">Salvar</button>`)}
function saveHeader(){const n=document.getElementById('hName').value.trim();if(!n)return alert('Informe o nome.');state.headers.push({name:n,desc:document.getElementById('hDesc').value.trim(),image:''});save();closeModal();showPage('cabecalhos')}
function setPhoto(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.settings.photo=r.result;save();showPage('config')};r.readAsDataURL(f)}
// Configuração da professora: escolas múltiplas, turmas/disciplinas, múltiplos cabeçalhos e Pix opcional
function openTeacherConfig(){}

function init(){
  // expõe a configuração como página separada pelo mesmo app, sem mostrar opção de professora depois do login
  if(localStorage.getItem('planejaEduLogged')) enter();
  icon();
}
function login(){localStorage.setItem('planejaEduLogged','1');state.user.name='Julia Cardoso';save();enter()}
function demoLogin(){localStorage.setItem('planejaEduLogged','1');enter()}
init();
</script>
</body></html>
